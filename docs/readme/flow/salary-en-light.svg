</style><rect x="-13" y="-85" width="798" height="804" rx="14" fill="#fbfcfc" stroke="#dce2e5"/><text class="lbl" x="380" y="-60">THE QUESTION</text><rect x="228.5" y="-50" width="303" height="34" rx="17" fill="#0b6a85"/><text class="ask" x="380" y="-28">Convert the salary of the second one</text><path class="edge p" d="M380 -16V16"/><path class="edge p" d="M380 68V92"/><path class="edge p" d="M380 144V168"/><path class="edge p" d="M380 220V244"/><path class="edge" d="M380 296C380 322 88 314 88 340"/><path class="edge" d="M380 296C380 322 234 316 234 340"/><path class="edge p" d="M380 296V340"/><path class="edge" d="M380 296C380 322 526 316 526 340"/><path class="edge" d="M380 296C380 322 672 314 672 340"/><path class="edge" d="M88 396C88 416 120 416 120 436"/><path class="edge" d="M234 396C234 416 216 416 216 436"/><path class="edge" d="M168 488C168 512 340 500 340 524"/><path class="edge p" d="M380 396V524"/><path class="edge p" d="M380 576V608"/><path class="edge" d="M526 396C526 500 524 556 474 608"/><path class="edge" d="M672 396C672 540 620 634 520 634"/><path class="ghost" d="M738 368H744Q752 368 752 360V126Q752 118 744 118H520"/><path class="ghost" d="M218 614H240"/><text class="note" transform="translate(766 244) rotate(-90)" text-anchor="middle">comes back in the next chat</text><path class="run" d="M380 68V92" style="animation:e0 9.5s linear infinite,dash 1.2s linear infinite"/><path class="run" d="M380 144V168" style="animation:e1 9.5s linear infinite,dash 1.2s linear infinite"/><path class="run" d="M380 220V244" style="animation:e2 9.5s linear infinite,dash 1.2s linear infinite"/><path class="run" d="M380 296V340" style="animation:e3 9.5s linear infinite,dash 1.2s linear infinite"/><path class="run" d="M380 396V524" style="animation:e4 9.5s linear infinite,dash 1.2s linear infinite"/><path class="run" d="M380 576V608" style="animation:e5 9.5s linear infinite,dash 1.2s linear infinite"/><g><rect class="box lit" x="240" y="16" width="280" height="52" rx="8" style="animation:n0 9.5s linear infinite"/><circle cx="507" cy="29" r="3.5" fill="#848f97"/><text class="t" x="380" y="39">You ask</text><text class="s" x="380" y="57">the question leaves the screen</text></g><g><rect class="box lit" x="240" y="92" width="280" height="52" rx="8" style="animation:n1 9.5s linear infinite"/><circle cx="507" cy="105" r="3.5" fill="#845400"/><text class="t" x="380" y="115">Remember</text><text class="s" x="380" y="133">this chat + earlier chats</text></g><g><rect class="box lit" x="240" y="168" width="280" height="52" rx="8" style="animation:n2 9.5s linear infinite"/><circle cx="507" cy="181" r="3.5" fill="#0b6a85"/><text class="t" x="380" y="191">Understand the request</text><text class="s" x="380" y="209">picks 1 of 6 routes</text></g><g><rect class="box lit" x="240" y="244" width="280" height="52" rx="8" style="animation:n3 9.5s linear infinite"/><circle cx="507" cy="257" r="3.5" fill="#0b6a85"/><text class="t" x="380" y="267">Choose the tools</text><text class="s" x="380" y="285">one agent, five tools</text></g><g class="off"><rect class="box" x="22" y="340" width="132" height="56" rx="8"/><circle cx="145" cy="349" r="3" fill="#845400"/><text class="t sm" x="88" y="356">Search jobs</text><text class="s" x="88" y="374">Remotive</text><text class="s" x="88" y="390">Arbeitnow</text></g><g class="off"><rect class="box" x="168" y="340" width="132" height="56" rx="8"/><circle cx="291" cy="349" r="3" fill="#845400"/><text class="t sm" x="234" y="365">Read the résumé</text><text class="s" x="234" y="383">matching excerpts</text></g><g><rect class="box lit" x="314" y="340" width="132" height="56" rx="8" style="animation:n4 9.5s linear infinite"/><circle cx="437" cy="349" r="3" fill="#845400"/><text class="t sm" x="380" y="365">Convert salary</text><text class="s" x="380" y="383">today's rate</text></g><g class="off"><rect class="box" x="460" y="340" width="132" height="56" rx="8"/><circle cx="583" cy="349" r="3" fill="#845400"/><text class="t sm" x="526" y="365">Check history</text><text class="s" x="526" y="383">seen and applied</text></g><g class="off"><rect class="box" x="606" y="340" width="132" height="56" rx="8"/><circle cx="729" cy="349" r="3" fill="#845400"/><text class="t sm" x="672" y="365">Save a memory</text><text class="s" x="672" y="383">for next time</text></g><g class="off"><rect class="box" x="22" y="436" width="292" height="52" rx="8"/><circle cx="301" cy="449" r="3.5" fill="#848f97"/><text class="t" x="168" y="459">Filter and score the fit</text><text class="s" x="168" y="477">fixed rules, no AI</text></g><g><rect class="box lit" x="280" y="524" width="200" height="52" rx="8" style="animation:n5 9.5s linear infinite"/><circle cx="467" cy="537" r="3.5" fill="#0b6a85"/><text class="t" x="380" y="547">Fact-check</text><text class="s" x="380" y="565">claims vs. the job ad</text></g><g><rect class="box lit" x="240" y="608" width="280" height="52" rx="8" style="animation:n6 9.5s linear infinite"/><circle cx="507" cy="621" r="3.5" fill="#0b6a85"/><text class="t" x="380" y="631">Write the answer</text><text class="s" x="380" y="649">word by word</text></g><g><rect class="box" x="22" y="568" width="196" height="92" rx="8" stroke-dasharray="5 4"/><circle cx="205" cy="581" r="3.5" fill="#845400"/><text class="t" x="120" y="602">LangSmith</text><text class="s" x="120" y="620">records every step</text><text class="s" x="120" y="636">trace + evaluation</text></g><circle r="11" fill="#0b6a85" opacity=".22"><animateMotion dur="9.5s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0526;0.1211;0.1737;0.2421;0.2947;0.3632;0.4158;0.4842;0.5368;0.6053;0.6579;0.7263;1" keyPoints="0;0;0.087;0.087;0.1739;0.1739;0.2609;0.2609;0.4203;0.4203;0.8841;0.8841;1;1" path="M380 68V92M380 144V168M380 220V244M380 296V340M380 396V524M380 576V608"/><animate attributeName="opacity" dur="9.5s" repeatCount="indefinite" values="0.22;0.22;0;0;0.22" keyTimes="0;0.7463;0.7763;0.99;1"/></circle><circle r="5" fill="#0b