<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Remoto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Agente que encontra vagas remotas internacionais que aceitam candidatos no Brasil e mostra a evidência de cada decisão.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* =====================================================================
   RADAR REMOTO · TOKENS
   Layout: cabeçalho fino, conversa numa coluna de leitura central e uma
   coluna lateral fixa (gaveta abaixo de 960 px) para a transparência.

   Três camadas. Componentes só leem a camada 3 (ou a 2); a camada 1
   nunca aparece fora deste bloco.
   1. Primitivos (--p-*): valores crus. Cinzas com leve viés para o
      azul-petróleo do acento. Escala tipográfica modular 1,125 (segunda
      maior) sobre 16 px. Espaço em grade de 4 px. Raios 4/6/10/999.
      Sombras mínimas. Durações 120/200/320 ms.
   2. Semânticos (--color-*, --font-*, --text-*, --space-*, --radius-*,
      --shadow-*, --dur-*, --ease-*): papéis. É a única camada
      redefinida pelos temas e por prefers-reduced-motion.
   3. Componente (--btn-*, --card-*, --chip-*, --input-*, --header-*,
      --sidebar-*, --thread-*, --toast-*): o que cada peça consome.
   Temas: :root = claro. Escuro via prefers-color-scheme (quando não há
   escolha explícita) e via [data-theme="dark"] (alternância manual).
   ===================================================================== */
:root {
  /* 1 · Primitivos -------------------------------------------------- */
  --p-white: #ffffff;
  --p-gray-25: #fbfcfc;
  --p-gray-50: #f4f6f7;
  --p-gray-100: #e9edef;
  --p-gray-200: #dce2e5;
  --p-gray-300: #c3cbd0;
  --p-gray-500: #5a666e;
  --p-gray-700: #36434b;
  --p-gray-900: #0f171c;
  --p-ink-950: #0b0f12;
  --p-ink-900: #11161a;
  --p-ink-850: #161c21;
  --p-ink-800: #1e262c;
  --p-ink-700: #2b353d;
  --p-ink-400: #98a5ae;
  --p-ink-100: #e6ebee;
  --p-petrol-50: #e8f3f6;
  --p-petrol-600: #0b6a85;
  --p-petrol-700: #08566c;
  --p-petrol-300: #5cc3dc;
  --p-petrol-200: #8ad6e8;
  --p-petrol-900: #0e2a33;
  --p-petrol-975: #04171d;
  --p-green-700: #1b7a3e;
  --p-green-50: #e7f5ec;
  --p-green-300: #5fd38e;
  --p-green-900: #0f2a1b;
  --p-amber-800: #845400;
  --p-amber-50: #fdf3dc;
  --p-amber-300: #f2c35a;
  --p-amber-900: #2d220c;
  --p-red-700: #b3261e;
  --p-red-50: #fcebe9;
  --p-red-300: #f58b80;
  --p-red-900: #351512;

  --p-font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --p-font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --p-ratio: 1.125;
  --p-size--2: 0.79rem;   /* 12,6 px */
  --p-size--1: 0.889rem;  /* 14,2 px */
  --p-size-0: 1rem;       /* 16 px  */
  --p-size-1: 1.125rem;   /* 18 px  */
  --p-size-2: 1.266rem;   /* 20,3 px */
  --p-size-3: 1.424rem;   /* 22,8 px */
  --p-size-4: 1.602rem;   /* 25,6 px */
  --p-size-5: 1.802rem;   /* 28,8 px */

  --p-space-1: 4px;  --p-space-2: 8px;  --p-space-3: 12px; --p-space-4: 16px;
  --p-space-5: 20px; --p-space-6: 24px; --p-space-8: 32px; --p-space-10: 40px;
  --p-space-12: 48px; --p-space-16: 64px;

  --p-radius-1: 4px; --p-radius-2: 6px; --p-radius-3: 10px; --p-radius-pill: 999px;
  --p-shadow-1: 0 1px 2px rgb(15 23 28 / 0.06);
  --p-shadow-2: 0 8px 24px rgb(15 23 28 / 0.12), 0 1px 2px rgb(15 23 28 / 0.08);
  --p-dur-1: 120ms; --p-dur-2: 200ms; --p-dur-3: 320ms;

  /* 2 · Semânticos (tema claro) ------------------------------------- */
  --color-bg: var(--p-gray-25);
  --color-surface: var(--p-white);
  --color-sunken: var(--p-gray-50);
  --color-text: var(--p-gray-900);
  --color-text-muted: var(--p-gray-500);
  --color-text-soft: var(--p-gray-700);
  --color-border: var(--p-gray-100);
  --color-border-strong: var(--p-gray-200);
  --color-border-control: var(--p-gray-300);
  --color-accent: var(--p-petrol-600);
  --color-accent-hover: var(--p-petrol-700);
  --color-on-accent: var(--p-white);
  --color-accent-subtle: var(--p-petrol-50);
  --color-focus: var(--p-petrol-600);
  --color-success: var(--p-green-700);
  --color-success-bg: var(--p-green-50);
  --color-warning: var(--p-amber-800);
  --color-warning-bg: var(--p-amber-50);
  --color-danger: var(--p-red-700);
  --color-danger-bg: var(--p-red-50);
  --color-scrim: rgb(15 23 28 / 0.32);
  --color-inverse-bg: var(--p-gray-900);
  --color-inverse-text: var(--p-ink-100);

  --font-sans: var(--p-font-sans);
  --font-mono: var(--p-font-mono);
  --text-xs: var(--p-size--2);
  --text-sm: var(--p-size--1);
  --text-md: var(--p-size-0);
  --text-lg: var(--p-size-1);
  --text-xl: var(--p-size-3);
  --text-2xl: var(--p-size-5);
  --leading-tight: 1.25;
  --leading-body: 1.55;
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600;
  --tracking-label: 0.04em;

  --space-1: var(--p-space-1); --space-2: var(--p-space-2); --space-3: var(--p-space-3);
  --space-4: var(--p-space-4); --space-5: var(--p-space-5); --space-6: var(--p-space-6);
  --space-8: var(--p-space-8); --space-10: var(--p-space-10); --space-12: var(--p-space-12);
  --space-16: var(--p-space-16);
  --gutter: var(--p-space-4);

  --radius-sm: var(--p-radius-1); --radius-md: var(--p-radius-2);
  --radius-lg: var(--p-radius-3); --radius-pill: var(--p-radius-pill);
  --shadow-raised: var(--p-shadow-1);
  --shadow-overlay: var(--p-shadow-2);
  --dur-fast: var(--p-dur-1); --dur-base: var(--p-dur-2); --dur-slow: var(--p-dur-3);
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);

  /* 3 · Componente --------------------------------------------------- */
  --header-h: 56px;
  --header-bg: var(--color-bg);
  --sidebar-w: 360px;
  --sidebar-bg: var(--color-sunken);
  --thread-max: 760px;
  --btn-h: 40px;
  --btn-radius: var(--radius-md);
  --btn-primary-bg: var(--color-accent);
  --btn-primary-bg-hover: var(--color-accent-hover);
  --btn-primary-fg: var(--color-on-accent);
  --btn-ghost-bg-hover: var(--color-sunken);
  --btn-secondary-border: var(--color-border-control);
  --card-bg: var(--color-surface);
  --card-border: var(--color-border-strong);
  --card-radius: var(--radius-lg);
  --card-pad: var(--space-5);
  --chip-bg: var(--color-sunken);
  --chip-fg: var(--color-text-soft);
  --chip-radius: var(--radius-sm);
  --input-bg: var(--color-surface);
  --input-border: var(--color-border-control);
  --input-radius: var(--radius-lg);
  --bubble-user-bg: var(--color-sunken);
  --toast-bg: var(--color-inverse-bg);
  --toast-fg: var(--color-inverse-text);
  --focus-ring: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-focus);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: var(--p-ink-950);
    --color-surface: var(--p-ink-850);
    --color-sunken: var(--p-ink-900);
    --color-text: var(--p-ink-100);
    --color-text-muted: var(--p-ink-400);
    --color-text-soft: var(--p-ink-100);
    --color-border: var(--p-ink-800);
    --color-border-strong: var(--p-ink-800);
    --color-border-control: var(--p-ink-700);
    --color-accent: var(--p-petrol-300);
    --color-accent-hover: var(--p-petrol-200);
    --color-on-accent: var(--p-petrol-975);
    --color-accent-subtle: var(--p-petrol-900);
    --color-focus: var(--p-petrol-300);
    --color-success: var(--p-green-300);
    --color-success-bg: var(--p-green-900);
    --color-warning: var(--p-amber-300);
    --color-warning-bg: var(--p-amber-900);
    --color-danger: var(--p-red-300);
    --color-danger-bg: var(--p-red-900);
    --color-scrim: rgb(0 0 0 / 0.56);
    --color-inverse-bg: var(--p-ink-100);
    --color-inverse-text: var(--p-gray-900);
    --shadow-raised: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-bg: var(--p-ink-950);
  --color-surface: var(--p-ink-850);
  --color-sunken: var(--p-ink-900);
  --color-text: var(--p-ink-100);
  --color-text-muted: var(--p-ink-400);
  --color-text-soft: var(--p-ink-100);
  --color-border: var(--p-ink-800);
  --color-border-strong: var(--p-ink-800);
  --color-border-control: var(--p-ink-700);
  --color-accent: var(--p-petrol-300);
  --color-accent-hover: var(--p-petrol-200);
  --color-on-accent: var(--p-petrol-975);
  --color-accent-subtle: var(--p-petrol-900);
  --color-focus: var(--p-petrol-300);
  --color-success: var(--p-green-300);
  --color-success-bg: var(--p-green-900);
  --color-warning: var(--p-amber-300);
  --color-warning-bg: var(--p-amber-900);
  --color-danger: var(--p-red-300);
  --color-danger-bg: var(--p-red-900);
  --color-scrim: rgb(0 0 0 / 0.56);
  --color-inverse-bg: var(--p-ink-100);
  --color-inverse-text: var(--p-gray-900);
  --shadow-raised: none;
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 0ms; --dur-base: 0ms; --dur-slow: 0ms; }
}
@media (pointer: coarse) {
  :root { --btn-h: 44px; }
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header-bg); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: var(--leading-tight); font-weight: var(--weight-semibold); letter-spacing: -0.01em; }
a { color: var(--color-accent); text-underline-offset: 3px; }
a:hover { color: var(--color-accent-hover); }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.skip-link { position: absolute; left: var(--space-4); top: calc(env(safe-area-inset-top, 0px) + var(--space-2)); z-index: 100; padding: var(--space-2) var(--space-3); background: var(--color-surface); border-radius: var(--radius-md); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--btn-h); padding: 0 var(--space-4);
  border: 1px solid transparent; border-radius: var(--btn-radius);
  background: transparent; cursor: pointer; white-space: nowrap;
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.btn:active:not([aria-disabled="true"]):not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--btn-primary-bg); color: var(--btn-primary-fg); }
.btn-primary:hover { background: var(--btn-primary-bg-hover); }
.btn-secondary { border-color: var(--btn-secondary-border); background: var(--color-surface); }
.btn-secondary:hover { border-color: var(--color-text-muted); }
.btn-ghost:hover { background: var(--btn-ghost-bg-hover); }
.btn-icon { width: var(--btn-h); padding: 0; }
.btn[aria-disabled="true"], .btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.is-done { color: var(--color-success); border-color: var(--color-border-strong); cursor: default; }

/* ---------- App shell ---------- */
.app { display: flex; flex-direction: column; height: 100%; }
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--header-bg); border-bottom: 1px solid var(--color-border); }
.header-inner {
  min-height: var(--header-h);
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  padding-block: var(--space-2);
}
.brand { font-size: var(--text-md); font-weight: var(--weight-semibold); letter-spacing: -0.01em; margin-right: var(--space-1); }
.mode { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-text-muted); }
.mode-dot { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--color-accent); }
.sim-badge { font-size: var(--text-xs); color: var(--color-warning); background: var(--color-warning-bg); padding: 2px var(--space-2); border-radius: var(--chip-radius); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-1); }
.confirm-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  padding-block: var(--space-2);
  border-top: 1px solid var(--color-border); background: var(--color-sunken); font-size: var(--text-sm);
}
.confirm-bar p { margin-right: auto; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--sidebar-w); }
.conversation { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.thread { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-padding-bottom: var(--space-8); }
.thread-inner {
  max-width: calc(var(--thread-max) + 2 * var(--gutter)); margin-inline: auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  padding-block: var(--space-10) var(--space-8);
  display: flex; flex-direction: column; gap: var(--space-10);
}

/* ---------- Estado vazio ---------- */
.empty { display: flex; flex-direction: column; gap: var(--space-6); padding-top: var(--space-8); }
.empty h1 { font-size: var(--text-2xl); max-width: 22ch; }
.empty-lead { color: var(--color-text-muted); max-width: 60ch; }
.eyebrow { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--color-text-muted); font-weight: var(--weight-medium); }
.suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.suggestion {
  text-align: left; min-height: 56px; padding: var(--space-3) var(--space-4);
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius);
  font-size: var(--text-sm); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.suggestion:hover { border-color: var(--color-accent); }
.suggestion .icon { color: var(--color-text-muted); }
.suggestion:hover .icon { color: var(--color-accent); }

/* ---------- Mensagens ---------- */
.turn { display: flex; flex-direction: column; gap: var(--space-5); }
.msg-user { align-self: flex-end; max-width: min(85%, 560px); background: var(--bubble-user-bg); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-agent { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
.agent-label { display: flex; align-items: center; gap: var(--space-2); }
.answer { white-space: pre-line; max-width: 65ch; overflow-wrap: anywhere; }

.progress { display: flex; align-items: center; gap: var(--space-3); color: var(--color-text-muted); font-size: var(--text-sm); min-height: 24px; }
.pulse { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--color-accent); animation: pulse 1.2s var(--ease-out) infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--color-accent-subtle); opacity: 1; } 70% { box-shadow: 0 0 0 8px transparent; opacity: 0.6; } 100% { box-shadow: 0 0 0 0 transparent; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.progress-step { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
.progress-text { color: var(--color-text); }

.error-box { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-danger-bg); color: var(--color-text); }
.error-box p { flex: 1 1 260px; }
.error-box strong { color: var(--color-danger); font-weight: var(--weight-semibold); }

.results-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.cards { display: flex; flex-direction: column; gap: var(--space-3); }

/* ---------- Card de vaga ---------- */
.job { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--space-3); box-shadow: var(--shadow-raised); min-width: 0; }
.job-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
.job-title { font-size: var(--text-lg); overflow-wrap: anywhere; }
.job-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); font-size: var(--text-sm); color: var(--color-text-muted); margin-top: var(--space-1); }
.sep { color: var(--color-border-control); }
.salary { font-family: var(--font-mono); font-size: var(--text-sm); font-variant-numeric: tabular-nums; color: var(--color-text); }
.salary.is-missing { color: var(--color-text-muted); font-family: var(--font-sans); }
.reason { font-size: var(--text-sm); color: var(--color-text-soft); max-width: 65ch; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-1); list-style: none; padding: 0; margin: 0; }
.chip { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: var(--chip-radius); background: var(--chip-bg); color: var(--chip-fg); border: 1px solid var(--color-border); }
.status { display: inline-flex; align-items: center; gap: var(--space-1); flex: none; font-size: var(--text-xs); font-weight: var(--weight-medium); padding: 3px var(--space-2); border-radius: var(--radius-pill); }
.status .icon { width: 13px; height: 13px; stroke-width: 2; }
.status-recomendado { color: var(--color-success); background: var(--color-success-bg); }
.status-pendente { color: var(--color-warning); background: var(--color-warning-bg); }
.status-descartado { color: var(--color-danger); background: var(--color-danger-bg); }
.job-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--color-border); }
.job-actions .link { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-sm); font-weight: var(--weight-medium); min-height: var(--btn-h); margin-right: auto; }

.discarded-toggle { align-self: flex-start; display: inline-flex; align-items: center; gap: var(--space-2); background: none; border: 0; padding: var(--space-2) 0; min-height: var(--btn-h); font-size: var(--text-sm); color: var(--color-text-muted); cursor: pointer; }
.discarded-toggle:hover { color: var(--color-text); }
.discarded-toggle .icon { transition: transform var(--dur-base) var(--ease-out); }
.discarded-toggle[aria-expanded="true"] .icon { transform: rotate(90deg); }
.discarded-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--card-border); border-radius: var(--card-radius); }

/* ---------- Composer ---------- */
.composer-wrap {

}
.composer { max-width: var(--thread-max); margin-inline: auto; display: flex; flex-direction: column; gap: var(--space-2); }
.composer-box { display: flex; align-items: flex-end; gap: var(--space-2); background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--input-radius); padding: var(--space-2); transition: border-color var(--dur-fast) var(--ease-out); }
.composer-box:focus-within { border-color: var(--color-focus); box-shadow: 0 0 0 1px var(--color-focus); }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; padding: var(--space-2); line-height: var(--leading-body); max-height: 200px; font-size: var(--text-md); }
.composer textarea:focus-visible { box-shadow: none; }
.composer textarea::placeholder { color: var(--color-text-muted); }
.composer-hint { display: flex; justify-content: space-between; gap: var(--space-3); font-size: var(--text-xs); color: var(--color-text-muted); }
kbd { font-family: var(--font-mono); font-size: var(--text-xs); }

/* ---------- Coluna lateral ---------- */
.sidebar { background: var(--sidebar-bg); border-left: 1px solid var(--color-border); overflow-y: auto; min-height: 0; }
.sidebar-inner { padding: var(--space-6) var(--space-5) calc(var(--space-6) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--space-5); }
.sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.sidebar h2 { font-size: var(--text-md); }
.sidebar-lead { font-size: var(--text-sm); color: var(--color-text-muted); }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--space-1) var(--space-2); padding: var(--space-3) 0; border-top: 1px solid var(--color-border); }
.plan-num { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.plan-name { font-size: var(--text-sm); color: var(--color-text-soft); }
.rubric { grid-column: 2; justify-self: start; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); border: 1px solid var(--color-border-strong); border-radius: var(--chip-radius); padding: 0 var(--space-1); }
.sidebar-note { font-size: var(--text-xs); color: var(--color-text-muted); border-top: 1px dashed var(--color-border-control); padding-top: var(--space-4); }
.drawer-only { display: none; }
.scrim { position: fixed; inset: 0; background: var(--color-scrim); z-index: 39; }

@media (max-width: 959px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .drawer-only { display: inline-flex; }
  .sidebar {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
    width: min(var(--sidebar-w), 88vw);
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    box-shadow: var(--shadow-overlay);

  }
  .sidebar.is-open { transform: none; visibility: visible; transition: transform var(--dur-slow) var(--ease-out), visibility 0s; }
}
@media (max-width: 559px) {
  .suggestions { grid-template-columns: minmax(0, 1fr); }
  .empty h1 { font-size: var(--text-xl); }
  .thread-inner { padding-top: var(--space-6); gap: var(--space-8); }
  .job { --card-pad: var(--space-4); }
  .mode-model { display: none; }
  .composer-hint .hint-keys { display: none; }
}

/* ---------- Toasts ---------- */
.toasts { position: fixed; z-index: 60; right: max(var(--gutter), env(safe-area-inset-right, 0px)); bottom: calc(112px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-end; pointer-events: none; max-width: calc(100vw - 2 * var(--gutter)); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: var(--space-3); background: var(--toast-bg); color: var(--toast-fg); border-radius: var(--radius-md); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); font-size: var(--text-sm); box-shadow: var(--shadow-overlay); max-width: 420px; }
.toast .btn { color: inherit; min-height: 32px; width: 32px; }
.toast .btn:hover { background: transparent; opacity: 0.8; }
.toast-enter-active, .toast-leave-active { transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
.toast-enter-from, .toast-leave-to { opacity: 0; transform: translateY(6px); }
.fade-enter-active, .fade-leave-active { transition: opacity var(--dur-base) var(--ease-out); }
.fade-enter-from, .fade-leave-to { opacity: 0; }
[v-cloak] { display: none; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script>
(() => {
'use strict';
const { createApp, reactive, nextTick } = Vue;

/* ---------- Constantes ---------- */
const STAGES = [
  { id: 'intencao', label: 'Interpretando o pedido', rubric: '1.4 Saída estruturada' },
  { id: 'ferramentas', label: 'Escolhendo as ferramentas', rubric: '5.3 AgentExecutor · 2.2 ReAct' },
  { id: 'buscar_vagas', label: 'Buscando vagas na Remotive e na Arbeitnow', rubric: '2.4 Function calling' },
  { id: 'converter_moeda', label: 'Consultando câmbio na AwesomeAPI', rubric: '4.2 API externa' },
  { id: 'recuperar_contexto', label: 'Recuperando trechos do currículo', rubric: '4.4 RAG/FAISS' },
  { id: 'consultar_candidaturas', label: 'Gerando e executando SQL', rubric: '4.3 Text-to-SQL' },
  { id: 'verificacao', label: 'Verificando afirmações', rubric: '5.1 NLI + correção' },
  { id: 'resposta', label: 'Escrevendo a resposta', rubric: '5.4 Memória por sessão' },
];
const STAGE_INDEX = Object.fromEntries(STAGES.map((s, i) => [s.id, i]));
const STATUS_TEXT = { recomendado: 'Recomendada', pendente: 'Pendente', descartado: 'Descartada' };
const STATUS_ICON = { recomendado: 'i-check', pendente: 'i-clock', descartado: 'i-x' };
const SUGGESTIONS = [
  'Mostre vagas remotas de Python que aceitam Brasil',
  'Converta o salário da segunda',
  'Qual combina mais com meu currículo?',
  'Quais vagas acima de 5000 USD eu ainda não apliquei?',
];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Armazenamento local tolerante a falhas ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } },
};
function newSessionId() {
  const abc = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const bytes = new Uint8Array(20);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(bytes) : bytes.forEach((_, i) => { bytes[i] = Math.random() * 256; });
  return 'rr-' + Array.from(bytes, (b) => abc[b % abc.length]).join('');
}
function loadSessionId() {
  const s = store.get('rr.session');
  if (s && /^[a-zA-Z0-9_-]{1,80}$/.test(s)) return s;
  const n = newSessionId(); store.set('rr.session', n); return n;
}

/* ---------- API real ---------- */
async function fetchJSON(url, opts = {}, timeout = 15000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    const type = res.headers.get('content-type') || '';
    if (!res.ok || !type.includes('json')) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}
async function streamChat(body, onEvent) {
  const res = await fetch('/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
    body: JSON.stringify(body),
  });
  if (!res.ok || !res.body) throw Object.assign(new Error('HTTP ' + res.status), { noStream: true });
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', final = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) !== -1) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const data = chunk.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).replace(/^ /, '')).join('\n');
      if (!data) continue;
      let ev; try { ev = JSON.parse(data); } catch (e) { continue; }
      if (ev.type === 'final') final = ev.data; else onEvent(ev);
    }
  }
  if (!final) throw new Error('Fluxo encerrado sem resposta final');
  return final;
}

/* ---------- Modo simulado ---------- */
const RATE = { USD: 5.42, EUR: 5.87 };
const brl = (n) => 'R$ ' + Math.round(n).toLocaleString('pt-BR');
const JOBS = [
  { id: 'rmt-48213', title: 'Senior Backend Engineer (Python)', company: 'Nordlys Data', source: 'Remotive', url: 'https://remotive.com/remote-jobs/software-dev',
    status: 'recomendado', usd: 6500, salary: 'USD 6.500/mês · ≈ ' + brl(6500 * RATE.USD),
    reason: 'Aceita candidatos na América Latina e pede 4 das 5 skills principais do seu currículo.',
    evidence: 'We hire anywhere in Latin America, including Brazil.', skills: ['Python', 'Django', 'PostgreSQL', 'Docker'], applied: false },
  { id: 'abn-77140', title: 'Data Engineer — Python & Airflow', company: 'Tessera Labs', source: 'Arbeitnow', url: 'https://www.arbeitnow.com/',
    status: 'recomendado', usd: 6800, salary: 'USD 6.800/mês · ≈ ' + brl(6800 * RATE.USD),
    reason: 'Contrata no Brasil como prestador internacional e usa a mesma stack de dados do seu currículo.',
    evidence: 'Contractors based in Brazil or Argentina are welcome.', skills: ['Python', 'Airflow', 'SQL', 'AWS'], applied: false },
  { id: 'rmt-48377', title: 'Python Developer, ML Platform', company: 'Kalido', source: 'Remotive', url: 'https://remotive.com/remote-jobs/software-dev',
    status: 'pendente', usd: null, salary: null,
    reason: 'O anúncio diz “remote worldwide”, mas não informa o fuso exigido. Confirme a sobreposição de horário antes de aplicar.',
    evidence: 'Remote worldwide. Async-first team.', skills: ['Python', 'FastAPI', 'Kubernetes'], applied: false },
  { id: 'rmt-48102', title: 'Staff Python Engineer', company: 'Brightwave Health', source: 'Remotive', url: 'https://remotive.com/remote-jobs/software-dev',
    status: 'descartado', usd: 9000, salary: 'USD 9.000/mês · ≈ ' + brl(9000 * RATE.USD),
    reason: 'Exige residência nos Estados Unidos (“US only”).', evidence: 'Remote (US only).', skills: ['Python', 'GCP'], applied: false },
  { id: 'abn-77012', title: 'Backend Developer', company: 'Orbital Payments', source: 'Arbeitnow', url: 'https://www.arbeitnow.com/',
    status: 'descartado', usd: 5200, salary: 'EUR 4.800/mês · ≈ ' + brl(4800 * RATE.EUR),
    reason: 'Exige autorização de trabalho na União Europeia.', evidence: 'Must hold an EU work permit.', skills: ['Python', 'Go'], applied: false },
];
const pick = (...ids) => ids.map((id) => {
  const { usd, applied, ...j } = JOBS.find((x) => x.id === id);
  return { ...j, skills: [...j.skills] };
});
function buildSimOutput(text) {
  const q = text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let answer, recs, needsFx = false, needsSql = false, needsRag = false;
  if (/convert|salario|cambio|em reais|brl/.test(q)) {
    needsFx = true;
    answer = 'A segunda vaga da lista, Data Engineer na Tessera Labs, paga USD 6.800 por mês.\nCom o câmbio simulado de R$ 5,42 por dólar, isso dá cerca de ' + brl(6800 * RATE.USD) + ' por mês, antes de impostos e taxas de remessa.';
    recs = pick('abn-77140');
  } else if (/curriculo|combina|perfil/.test(q)) {
    needsRag = true;
    answer = 'A vaga que mais combina com seu currículo é Data Engineer na Tessera Labs: ela pede Python, Airflow e SQL, as três skills que aparecem nos seus dois últimos empregos.\nEm seguida vem a Nordlys Data, que pede Django, uma skill que você usou há mais de três anos.';
    recs = pick('abn-77140', 'rmt-48213', 'rmt-48377');
    recs[0].reason = 'Combina com 5 de 6 requisitos. O currículo cita Airflow em dois empregos recentes.';
    recs[1].reason = 'Combina com 4 de 6 requisitos. Django aparece só numa experiência de 2021.';
  } else if (/5\.?000|apliquei|aplicar|candidat/.test(q)) {
    needsSql = true; needsFx = true;
    answer = 'Encontrei 2 vagas acima de USD 5.000 por mês sem candidatura registrada no seu histórico.\nA vaga da Orbital Payments também passa do valor, mas foi descartada porque exige autorização de trabalho na União Europeia.';
    recs = pick('rmt-48213', 'abn-77140', 'abn-77012');
  } else {
    needsFx = true; needsRag = true;
    answer = 'Encontrei 5 vagas remotas de Python. 3 aceitam candidatos no Brasil: 2 combinam bem com seu currículo e 1 precisa de confirmação sobre fuso horário.\nDescartei 2 porque o anúncio restringe o país de residência.';
    recs = pick('rmt-48213', 'abn-77140', 'rmt-48377', 'rmt-48102', 'abn-77012');
  }
  return { answer, recommendations: recs, tool_calls: [], verification: [], mode: 'dummy', _plan: { needsFx, needsSql, needsRag } };
}
async function simulateChat(text, onEvent) {
  const out = buildSimOutput(text);
  const { needsFx, needsSql, needsRag } = out._plan; delete out._plan;
  const j = (ms) => Math.round(ms * (0.75 + Math.random() * 0.5));
  const run = async (id, source, ms, detail, status = 'ok') => {
    onEvent({ type: 'stage', id, status: 'running', source, detail: '' });
    const d = j(ms); await sleep(d);
    onEvent({ type: 'stage', id, status, source, detail, duration_ms: d });
  };
  await run('intencao', 'OpenAI', 650, 'Pedido estruturado em JSON');
  await run('ferramentas', 'OpenAI', 450, 'Plano ReAct com as ferramentas necessárias');
  onEvent({ type: 'stage', id: 'buscar_vagas', status: 'running', source: 'Remotive', detail: '' });
  onEvent({ type: 'stage', id: 'buscar_vagas', status: 'running', source: 'Arbeitnow', detail: '' });
  const a = j(900); await sleep(a);
  onEvent({ type: 'stage', id: 'buscar_vagas', status: 'cache', source: 'Arbeitnow', detail: 'Resposta em cache de 12 min', duration_ms: a });
  const r = j(500); await sleep(r);
  onEvent({ type: 'stage', id: 'buscar_vagas', status: 'ok', source: 'Remotive', detail: '38 vagas, 5 relevantes', duration_ms: a + r });
  if (needsFx) await run('converter_moeda', 'AwesomeAPI', 600, 'USD-BRL 5,42 · EUR-BRL 5,87');
  if (needsRag) await run('recuperar_contexto', 'FAISS documental', 800, '4 trechos do currículo');
  if (needsSql) await run('consultar_candidaturas', 'SQLite', 700, "SELECT vaga_id FROM candidaturas WHERE session_id = ? AND status = 'enviada'");
  await run('verificacao', 'NLI local', 1200, 'Afirmações conferidas com o anúncio');
  await run('resposta', 'OpenAI', 500, 'Resposta salva na memória da sessão');
  return out;
}

/* ---------- Componente: card de vaga ---------- */
const JobCard = {
  props: { job: Object, actions: Object },
  emits: ['act'],
  data: () => ({ STATUS_TEXT, STATUS_ICON, uid: Math.random().toString(36).slice(2, 8) }),
  computed: {
    st() { return this.actions[this.job.id] || {}; },
    titleId() { return 'job-' + this.job.id + '-' + this.uid; },
  },
  template: `
  <article class="job" :aria-labelledby="titleId">
    <div class="job-top">
      <div style="min-width:0">
        <h3 class="job-title" :id="titleId">{{ job.title }}</h3>
        <p class="job-meta">
          <span>{{ job.company }}</span><span class="sep" aria-hidden="true">·</span>
          <span>via {{ job.source }}</span>
        </p>
      </div>
      <span class="status" :class="'status-' + job.status">
        <svg class="icon" aria-hidden="true"><use :href="'#' + STATUS_ICON[job.status]"/></svg>
        {{ STATUS_TEXT[job.status] || job.status }}
      </span>
    </div>
    <p class="salary" :class="{ 'is-missing': !job.salary }">{{ job.salary || 'Salário não informado no anúncio' }}</p>
    <p class="reason" v-if="job.reason">{{ job.reason }}</p>
    <ul class="chips" v-if="job.skills && job.skills.length" aria-label="Skills pedidas">
      <li class="chip" v-for="s in job.skills" :key="s">{{ s }}</li>
    </ul>
    <div class="job-actions">
      <a class="link" :href="job.url" target="_blank" rel="noopener noreferrer">
        Ver anúncio<span class="sr-only"> de {{ job.title }} (abre em nova aba)</span>
        <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>
      </a>
      <button type="button" class="btn btn-secondary" :class="{ 'is-done': st.salva }"
        :aria-pressed="st.salva ? 'true' : 'false'" :aria-disabled="st.salva || st.busy ? 'true' : 'false'"
        @click="!st.salva && !st.busy && $emit('act', job, 'salva')">
        <svg v-if="st.salva" class="icon" aria-hidden="true"><use href="#i-check"/></svg>
        {{ st.salva ? 'Salva' : 'Salvar' }}<span class="sr-only"> {{ job.title }}</span>
      </button>
      <button type="button" class="btn btn-secondary" :class="{ 'is-done': st.enviada }"
        :aria-pressed="st.enviada ? 'true' : 'false'" :aria-disabled="st.enviada || st.busy ? 'true' : 'false'"
        @click="!st.enviada && !st.busy && $emit('act', job, 'enviada')">
        <svg v-if="st.enviada" class="icon" aria-hidden="true"><use href="#i-check"/></svg>
        {{ st.enviada ? 'Aplicada' : 'Já apliquei' }}<span class="sr-only"> para {{ job.title }}</span>
      </button>
    </div>
  </article>`,
};

/* ---------- App ---------- */
const app = createApp({
  components: { JobCard },
  data() {
    return {
      STAGES, SUGGESTIONS,
      sessionId: loadSessionId(),
      online: null,            // null = verificando, true = API ok, false = simulado
      apiMode: 'dummy',
      modelLabel: '',
      theme: 'light',
      messages: [],
      draft: '',
      busy: false,
      actions: reactive({}),
      toasts: [],
      live: '',
      confirmNew: false,
      drawerOpen: false,
      narrow: false,
    };
  },
  computed: {
    modeText() {
      if (this.online && this.apiMode === 'real') return 'Modo real';
      return 'Modo demo';
    },
    canSend() { return !this.busy && this.draft.trim().length > 0; },
    themeLabel() { return this.theme === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro'; },
  },
  methods: {
    /* tema */
    effectiveTheme() {
      const set = document.documentElement.getAttribute('data-theme');
      if (set === 'dark' || set === 'light') return set;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    },
    toggleTheme() {
      const next = this.effectiveTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      store.set('rr.theme', next);
      this.theme = next;
    },
    /* conexão */
    async checkApi() {
      try {
        const h = await fetchJSON('/health', {}, 3000);
        if (h.status !== 'ok') throw new Error('health');
        this.online = true; this.apiMode = h.mode === 'real' ? 'real' : 'dummy';
        try {
          const m = await fetchJSON('/modelos', {}, 3000);
          const at = (m.opcoes || []).find((o) => o.id === m.ativo);
          this.modelLabel = at ? at.rotulo : m.ativo || '';
        } catch (e) { /* sem rota de modelos ainda */ }
      } catch (e) {
        this.online = false; this.apiMode = 'dummy';
      }
    },
    /* conversa */
    stageLabel(ev) {
      if (!ev) return 'Preparando';
      if (ev.id === 'buscar_vagas' && ev.source) return 'Buscando vagas na ' + ev.source;
      const s = STAGES[STAGE_INDEX[ev.id]];
      return s ? s.label : ev.id;
    },
    currentStage(msg) {
      for (let i = msg.stages.length - 1; i >= 0; i--) if (msg.stages[i].status === 'running') return msg.stages[i];
      return msg.stages[msg.stages.length - 1] || null;
    },
    stepText(msg) {
      const ev = this.currentStage(msg);
      return ev && ev.id in STAGE_INDEX ? 'Etapa ' + (STAGE_INDEX[ev.id] + 1) + ' de ' + STAGES.length : 'Iniciando';
    },
    onStage(msg, ev) {
      if (ev.type !== 'stage') return;
      const key = ev.id + '|' + (ev.source || '');
      const i = msg.stages.findIndex((s) => s.key === key);
      const entry = { ...ev, key };
      if (i === -1) msg.stages.push(entry); else msg.stages.splice(i, 1, entry);
      if (ev.status === 'running') this.announce(this.stageLabel(ev));
    },
    recommended(msg) { return (msg.data?.recommendations || []).filter((r) => r.status !== 'descartado'); },
    discarded(msg) { return (msg.data?.recommendations || []).filter((r) => r.status === 'descartado'); },
    useSuggestion(s) { this.draft = s; this.send(); },
    onKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); this.send(); }
    },
    autosize() {
      const ta = this.$refs.input; if (!ta) return;
      ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
    },
    async send() {
      if (!this.canSend) return;
      const text = this.draft.trim();
      this.draft = ''; nextTick(this.autosize);
      this.messages.push({ id: Date.now() + '-u', role: 'user', text });
      const msg = reactive({ id: Date.now() + '-a', role: 'agent', prompt: text, status: 'pending', stages: [], data: null, error: '', showDiscarded: false });
      this.messages.push(msg);
      await this.runTurn(msg);
    },
    async runTurn(msg) {
      this.busy = true; msg.status = 'pending'; msg.stages = []; msg.error = '';
      this.announce('Processando o pedido');
      this.scrollToEnd();
      const body = { session_id: this.sessionId, message: msg.prompt };
      try {
        let out;
        if (this.online === false) {
          out = await simulateChat(msg.prompt, (ev) => this.onStage(msg, ev));
        } else {
          try {
            out = await streamChat(body, (ev) => this.onStage(msg, ev));
          } catch (e) {
            if (msg.stages.length) throw e;          // o fluxo começou e caiu
            out = await fetchJSON('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, 120000);
          }
          if (out.mode) this.apiMode = out.mode === 'real' ? 'real' : 'dummy';
        }
        msg.data = out; msg.status = 'done';
        const n = this.recommended(msg).length;
        this.announce('Resposta pronta. ' + (n === 1 ? '1 vaga' : n + ' vagas') + ' na lista.');
      } catch (e) {
        msg.status = 'error';
        msg.error = navigator.onLine === false
          ? 'Você está sem conexão. Reconecte e tente de novo.'
          : 'O servidor não respondeu a tempo. Tente de novo em alguns segundos.';
        this.announce('Erro: ' + msg.error);
      } finally {
        this.busy = false;
        this.scrollToEnd();
      }
    },
    retry(msg) { if (!this.busy) this.runTurn(msg); },
    scrollToEnd() {
      nextTick(() => {
        const el = this.$refs.thread; if (!el) return;
        el.scrollTo({ top: el.scrollHeight, behavior: reducedMotion() ? 'auto' : 'smooth' });
      });
    },
    /* candidaturas */
    async act(job, status) {
      const cur = this.actions[job.id] || (this.actions[job.id] = reactive({}));
      if (cur.busy || cur[status]) return;
      cur.busy = true;
      try {
        if (this.online === false) await sleep(350);
        else await fetchJSON('/candidaturas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: this.sessionId, vaga_id: job.id, status }) }, 10000);
        cur[status] = true;
        this.toast(status === 'salva' ? 'Vaga salva no seu histórico.' : 'Candidatura registrada no histórico. Nada foi enviado à empresa.');
      } catch (e) {
        this.toast('Não foi possível registrar agora. Tente de novo.');
      } finally { cur.busy = false; }
    },
    toast(text) {
      const id = Date.now() + Math.random();
      this.toasts.push({ id, text });
      setTimeout(() => this.dismiss(id), 5000);
    },
    dismiss(id) { this.toasts = this.toasts.filter((t) => t.id !== id); },
    announce(text) { this.live = ''; nextTick(() => { this.live = text; }); },
    /* nova sessão */
    askNewSession() {
      if (!this.messages.length) { this.resetSession(); return; }
      this.confirmNew = true;
      nextTick(() => this.$refs.confirmBtn && this.$refs.confirmBtn.focus());
    },
    cancelNew() { this.confirmNew = false; nextTick(() => this.$refs.newBtn && this.$refs.newBtn.focus()); },
    resetSession() {
      this.sessionId = newSessionId(); store.set('rr.session', this.sessionId);
      this.messages = []; this.confirmNew = false; this.draft = '';
      Object.keys(this.actions).forEach((k) => delete this.actions[k]);
      this.toast('Nova sessão iniciada.');
      nextTick(() => this.$refs.input && this.$refs.input.focus());
    },
    /* gaveta */
    openDrawer() {
      this.drawerOpen = true;
      nextTick(() => this.$refs.drawerClose && this.$refs.drawerClose.focus());
    },
    closeDrawer() {
      if (!this.drawerOpen) return;
      this.drawerOpen = false;
      nextTick(() => this.$refs.drawerBtn && this.$refs.drawerBtn.focus());
    },
    trapFocus(e) {
      if (!this.narrow || !this.drawerOpen || e.key !== 'Tab') return;
      const f = this.$refs.sidebar.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    },
    onGlobalKey(e) {
      if (e.key !== 'Escape') return;
      if (this.drawerOpen) this.closeDrawer();
      else if (this.confirmNew) this.cancelNew();
    },
  },
  mounted() {
    const saved = store.get('rr.theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
    this.theme = this.effectiveTheme();
    const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
    mqDark.addEventListener('change', () => { this.theme = this.effectiveTheme(); });
    const mq = window.matchMedia('(max-width: 959px)');
    const setNarrow = () => { this.narrow = mq.matches; if (!mq.matches) this.drawerOpen = false; };
    setNarrow(); mq.addEventListener('change', setNarrow);
    document.addEventListener('keydown', this.onGlobalKey);
    this.checkApi();
  },
  template: `
  <div class="app">
    <a class="skip-link" href="#mensagem">Pular para a mensagem</a>
    <header class="header">
      <div class="header-inner">
        <span class="brand">Radar Remoto</span>
        <span class="mode" :title="online === false ? 'A API não respondeu. A conversa usa dados fictícios para demonstrar o fluxo.' : ''">
          <span class="mode-dot" aria-hidden="true"></span>
          <span>{{ online === null ? 'Conectando…' : modeText }}<span class="mode-model" v-if="online && apiMode === 'real' && modelLabel"> · {{ modelLabel }}</span></span>
        </span>
        <span class="sim-badge" v-if="online === false">Dados simulados</span>
        <div class="header-actions">
          <button type="button" class="btn btn-ghost btn-icon drawer-only" ref="drawerBtn"
            aria-label="Abrir etapas do agente" :aria-expanded="drawerOpen ? 'true' : 'false'" aria-controls="etapas" @click="openDrawer">
            <svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg>
          </button>
          <button type="button" class="btn btn-ghost btn-icon" :aria-label="themeLabel" :title="themeLabel" @click="toggleTheme">
            <svg class="icon" aria-hidden="true"><use :href="theme === 'dark' ? '#i-sun' : '#i-moon'"/></svg>
          </button>
          <button type="button" class="btn btn-secondary" ref="newBtn" @click="askNewSession" :aria-expanded="confirmNew ? 'true' : 'false'">Nova sessão</button>
        </div>
      </div>
      <div class="confirm-bar" v-if="confirmNew" role="group" aria-labelledby="confirm-text">
        <p id="confirm-text">Começar do zero? A conversa atual e o contexto desta sessão serão apagados.</p>
        <button type="button" class="btn btn-ghost" @click="cancelNew">Cancelar</button>
        <button type="button" class="btn btn-primary" ref="confirmBtn" @click="resetSession">Começar nova sessão</button>
      </div>
    </header>

    <div class="main">
      <main class="conversation" aria-label="Conversa com o agente">
        <div class="thread" ref="thread" tabindex="-1">
          <div class="thread-inner">
            <section class="empty" v-if="!messages.length" aria-labelledby="empty-title">
              <p class="eyebrow">Agente de vagas remotas</p>
              <h1 id="empty-title">Vagas remotas no exterior que aceitam quem mora no Brasil</h1>
              <p class="empty-lead">O agente busca na Remotive e na Arbeitnow, descarta o que não aceita candidatos daqui, converte o salário para reais, compara com seu currículo e confere cada afirmação no anúncio.</p>
              <div style="display:flex;flex-direction:column;gap:var(--space-3)">
                <h2 class="eyebrow" id="sug-title">Experimente</h2>
                <div class="suggestions" role="group" aria-labelledby="sug-title">
                  <button type="button" class="suggestion" v-for="s in SUGGESTIONS" :key="s" :aria-disabled="busy ? 'true' : 'false'" @click="useSuggestion(s)">
                    <span>{{ s }}</span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg>
                  </button>
                </div>
              </div>
            </section>

            <template v-for="m in messages" :key="m.id">
              <div v-if="m.role === 'user'" class="msg-user"><span class="sr-only">Você: </span>{{ m.text }}</div>
              <section v-else class="msg-agent" :aria-label="'Resposta para: ' + m.prompt" :aria-busy="m.status === 'pending' ? 'true' : 'false'">
                <div class="progress" v-if="m.status === 'pending'">
                  <span class="pulse" aria-hidden="true"></span>
                  <span class="progress-step">{{ stepText(m) }}</span>
                  <span class="progress-text">{{ stageLabel(currentStage(m)) }}…</span>
                </div>

                <div class="error-box" v-else-if="m.status === 'error'" role="alert">
                  <p><strong>Não consegui concluir.</strong> {{ m.error }}</p>
                  <button type="button" class="btn btn-secondary" :aria-disabled="busy ? 'true' : 'false'" @click="retry(m)">Tentar de novo</button>
                </div>

                <template v-else>
                  <p class="answer">{{ m.data.answer }}</p>
                  <div v-if="recommended(m).length" style="display:flex;flex-direction:column;gap:var(--space-3)">
                    <div class="results-head">
                      <h2 class="eyebrow">{{ recommended(m).length === 1 ? '1 vaga' : recommended(m).length + ' vagas' }}</h2>
                    </div>
                    <div class="cards">
                      <job-card v-for="r in recommended(m)" :key="r.id" :job="r" :actions="actions" @act="act"></job-card>
                    </div>
                  </div>
                  <div v-if="discarded(m).length" style="display:flex;flex-direction:column;gap:var(--space-2)">
                    <button type="button" class="discarded-toggle" :aria-expanded="m.showDiscarded ? 'true' : 'false'" :aria-controls="'desc-' + m.id" @click="m.showDiscarded = !m.showDiscarded">
                      <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
                      {{ discarded(m).length === 1 ? '1 descartada' : discarded(m).length + ' descartadas' }} · {{ m.showDiscarded ? 'ocultar' : 'ver motivo' }}
                    </button>
                    <ul class="discarded-list" :id="'desc-' + m.id" v-show="m.showDiscarded">
                      <li class="discarded-item" v-for="r in discarded(m)" :key="r.id">
                        <span><strong>{{ r.title }}</strong> · {{ r.company }}</span>
                        <span class="status status-descartado"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>Descartada</span>
                        <span class="why">{{ r.reason }} <a :href="r.url" target="_blank" rel="noopener noreferrer">Ver anúncio<span class="sr-only"> de {{ r.title }} (abre em nova aba)</span></a></span>
                      </li>
                    </ul>
                  </div>
                </template>
              </section>
            </template>
          </div>
        </div>

        <div class="composer-wrap">
          <form class="composer" @submit.prevent="send" aria-label="Enviar mensagem">
            <label for="mensagem" class="sr-only">Mensagem para o agente</label>
            <div class="composer-box">
              <textarea id="mensagem" ref="input" rows="1" v-model="draft" @keydown="onKeydown" @input="autosize"
                placeholder="Peça vagas, conversões ou comparações com seu currículo" aria-describedby="composer-hint" autocomplete="off"></textarea>
              <button type="submit" class="btn btn-primary btn-icon" :aria-disabled="canSend ? 'false' : 'true'" :aria-label="busy ? 'Aguarde o agente terminar' : 'Enviar mensagem'">
                <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
              </button>
            </div>
            <div class="composer-hint" id="composer-hint">
              <span>{{ busy ? 'O agente está trabalhando. Você pode escrever a próxima mensagem.' : 'O agente só registra ações que você já fez. Nenhuma candidatura é enviada.' }}</span>
              <span class="hint-keys"><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> quebra linha</span>
            </div>
          </form>
        </div>
      </main>

      <transition name="fade"><div class="scrim" v-if="narrow && drawerOpen" @click="closeDrawer" aria-hidden="true"></div></transition>
      <aside class="sidebar" id="etapas" ref="sidebar" :class="{ 'is-open': drawerOpen }"
        :role="narrow ? 'dialog' : null" :aria-modal="narrow && drawerOpen ? 'true' : null" aria-labelledby="etapas-title"
        @keydown="trapFocus">
        <div class="sidebar-inner">
          <div class="sidebar-head">
            <h2 id="etapas-title">Etapas do agente</h2>
            <button type="button" class="btn btn-ghost btn-icon drawer-only" ref="drawerClose" aria-label="Fechar etapas" @click="closeDrawer">
              <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
            </button>
          </div>
          <p class="sidebar-lead">Cada pedido passa por estas etapas, nesta ordem. O código ao lado de cada uma é a rubrica que ela cobre.</p>
          <ol class="plan">
            <li v-for="(s, i) in STAGES" :key="s.id">
              <span class="plan-num" aria-hidden="true">{{ String(i + 1).padStart(2, '0') }}</span>
              <span class="plan-name">{{ s.label }}</span>
              <span class="rubric"><span class="sr-only">Rubrica </span>{{ s.rubric }}</span>
            </li>
          </ol>
          <p class="sidebar-note">Aqui vão aparecer, ao vivo, o andamento de cada etapa, a fonte de cada dado e o tempo gasto.</p>
        </div>
      </aside>
    </div>

    <div class="sr-only" aria-live="polite" role="status">{{ live }}</div>
    <div class="toasts" role="status" aria-live="polite">
      <transition-group name="toast">
        <div class="toast" v-for="t in toasts" :key="t.id">
          <span>{{ t.text }}</span>
          <button type="button" class="btn btn-ghost btn-icon" aria-label="Fechar aviso" @click="dismiss(t.id)">
            <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
          </button>
        </div>
      </transition-group>
    </div>
  </div>`,
});
app.mount('#app');
})();
</script>
</body>
</html>
