<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Remoto</title>
<style>
:root{
  --paper:#F5F0E6;
  --paper-2:#EFE9DA;
  --card:#FBF8F1;
  --ink:#2B2922;
  --ink-2:#5E5949;
  --olive:#4B5426;
  --olive-hover:#3A4119;
  --on-olive:#F5F0E6;
  --rule:#CDC4AE;
  --focus:#7A5418;
  --ochre:#7A5418;
  --red:#8A2F24;
  --green:#3D6236;
  --grey:#5E5949;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:var(--olive)}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
p{margin:0 0 10px}
h1,h2,h3,h4{margin:0}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.masthead{max-width:1280px;margin:0 auto;padding:28px 24px 20px;border-bottom:1px solid var(--rule)}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.masthead-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:10px}
h1{font:400 40px/1.1 var(--serif);max-width:22ch}
.masthead-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.mode{font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:6px 10px;border:1px solid var(--rule);border-radius:2px;color:var(--grey);background:var(--card)}
.mode-real{color:var(--green);border-color:var(--green)}
.mode-demo{color:var(--ochre);border-color:var(--ochre)}

.btn{min-height:44px;padding:10px 16px;border:1px solid var(--olive);border-radius:2px;cursor:pointer;font-size:15px}
.btn-primary{background:var(--olive);color:var(--on-olive)}
.btn-primary:hover:not(:disabled){background:var(--olive-hover)}
.btn-ghost{background:transparent;color:var(--olive)}
.btn-ghost:hover:not(:disabled){background:var(--paper-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}

.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:calc(100vh - 150px)}
.chat{padding:24px;min-width:0;display:flex;flex-direction:column;gap:14px}
.evidence{border-left:1px solid var(--rule);padding:24px;background:var(--paper-2);min-width:0}
.evidence-title{font:400 22px/1.2 var(--serif);padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.evidence-h{font-size:12px;font-weight:400;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2);margin:24px 0 8px}
.evidence-query{font-size:13px;color:var(--ink-2);word-break:break-word;margin-top:12px}

.suggestions{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1px solid var(--rule);color:var(--ink);padding:8px 12px;min-height:44px;border-radius:2px;cursor:pointer;font-size:14px;text-align:left}
.chip:hover:not(:disabled){border-color:var(--olive);color:var(--olive)}
.chip:disabled{opacity:.55;cursor:not-allowed}

.transcript{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:340px;max-height:58vh;overflow-y:auto;padding:4px 0}
.empty{padding:24px 0;color:var(--ink-2);max-width:60ch}
.msg{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--rule)}
.msg:last-child{border-bottom:0}
.msg-label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2);padding-top:4px}
.msg-user .msg-body{font-size:17px}
.msg-body{min-width:0;overflow-wrap:anywhere}
.msg-error .msg-body p:first-child{color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.jobs{display:grid;gap:12px;margin-top:12px}
.job{border:1px solid var(--rule);background:var(--card);padding:16px;border-radius:2px}
.job-title{font:400 19px/1.3 var(--serif);margin:8px 0 4px}
.job-meta,.job-fact{margin:0;color:var(--ink-2);font-size:14px}
.job-reason{margin:8px 0 0;font-size:15px}
.job-link{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-weight:600}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.skills li{font-size:13px;border:1px solid var(--rule);padding:2px 8px;border-radius:2px;color:var(--ink-2)}

.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:1px solid currentColor;border-radius:2px}
.tag-recomendado{color:var(--olive);background:#E4E7CF}
.tag-pendente{color:var(--ochre);background:#F1E4CB}
.tag-descartado{color:var(--grey);background:#E7E3D8}
.tag-outro,.v-outro,.v-indisponivel{color:var(--grey);background:#E7E3D8}
.v-confirmada{color:var(--green);background:#DCE8D4}
.v-contradita{color:var(--red);background:#F1D9D3}
.v-incerta{color:var(--ochre);background:#F1E4CB}

.status-line{min-height:1.5em;margin:0;color:var(--ink-2);font-size:14px;display:flex;align-items:center;gap:8px}
.status-line.is-busy::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--olive);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}

.composer{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:14px;color:var(--ink-2)}
.composer-row{display:flex;gap:10px}
.composer input{flex:1;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--ink-2);border-radius:2px;background:var(--card);color:var(--ink)}

.check{padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.check:last-child{border-bottom:0}
.check-claim{margin:8px 0 4px;font-weight:600}
.rows{list-style:none;padding:0;margin:0}
.row{padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.row-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mono{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.muted{color:var(--ink-2);font-size:14px}
.evidence ul.quotes{margin:6px 0 0;padding-left:18px;font-size:14px}
.footnote{margin-top:24px;font-size:12px;color:var(--ink-2)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .evidence{border-left:0;border-top:1px solid var(--rule)}
  .masthead{padding:20px 16px 16px}
  h1{font-size:30px}
  .chat,.evidence{padding:16px}
  .transcript{max-height:none;min-height:0}
  .msg{grid-template-columns:minmax(0,1fr);gap:4px}
  .composer-row{flex-direction:column}
  .composer-row .btn{width:100%}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="kicker">Radar Remoto · vagas internacionais para brasileiros</div>
  <div class="masthead-row">
    <h1>Encontre vagas que fazem sentido para você</h1>
    <div class="masthead-tools">
      <span id="mode-indicator" class="mode" role="status">Modo não informado</span>
      <button type="button" id="new-session" class="btn btn-ghost">Nova sessão</button>
    </div>
  </div>
</header>

<div class="shell">
  <section class="chat" aria-labelledby="chat-title">
    <h2 id="chat-title" class="sr-only">Conversa</h2>

    <div id="suggestions" class="suggestions" role="group" aria-label="Sugestões de perguntas"></div>

    <div id="transcript" class="transcript" role="log" aria-live="polite" aria-relevant="additions"></div>

    <p id="status-line" class="status-line" role="status"></p>

    <form id="chat-form" class="composer" autocomplete="off">
      <label for="message-input" class="field-label">Sua pergunta sobre vagas</label>
      <div class="composer-row">
        <input id="message-input" name="message" type="text" maxlength="2000" placeholder="Ex.: Mostre vagas remotas de Python que aceitam Brasil">
        <button type="submit" id="send-button" class="btn btn-primary">Enviar</button>
      </div>
    </form>
  </section>

  <aside class="evidence" aria-labelledby="evidence-title">
    <h2 id="evidence-title" class="evidence-title">Por que este resultado?</h2>
    <div id="evidence-body"></div>
    <p class="footnote">Sem chamadas de modelo no navegador. As respostas vêm do servidor local em /chat.</p>
  </aside>
</div>

<script>
(function () {
  'use strict';

  var API_URL = '/chat';
  var SESSION_KEY = 'radar-remoto.session_id';

  var SUGGESTIONS = [
    'Mostre vagas remotas de Python',
    'Só as que aceitam Brasil',
    'Converta o salário da segunda',
    'Qual combina mais com meu currículo?'
  ];

  var STATUS_LABEL = { recomendado: 'Recomendado', pendente: 'Pendente', descartado: 'Descartado' };
  var STATUS_CLASS = { recomendado: 'tag-recomendado', pendente: 'tag-pendente', descartado: 'tag-descartado' };
  var VERIFY_LABEL = { confirmada: 'Confirmada', contradita: 'Contradita', incerta: 'Incerta', 'indisponível': 'Indisponível' };
  var VERIFY_CLASS = { confirmada: 'v-confirmada', contradita: 'v-contradita', incerta: 'v-incerta', 'indisponível': 'v-indisponivel' };

  // Exemplo visual: usado somente em preview fora do FastAPI, sempre rotulado.
  var SAMPLE = {
    mode: 'demo',
    answer: 'EXEMPLO VISUAL DE PREVIEW. Dados fictícios apenas para mostrar o layout; nenhuma busca real foi feita.',
    recommendations: [
      { id: 'exemplo-1', title: 'Exemplo: desenvolvedor(a) Python remoto', company: 'Empresa fictícia', source: 'exemplo', url: '', status: 'recomendado', reason: 'Dado fictício para visualização.', evidence: ['Trecho fictício da descrição da vaga.'], skills: ['Python'], salary: 'Não informado' },
      { id: 'exemplo-2', title: 'Exemplo: analista de dados remoto', company: 'Empresa fictícia', source: 'exemplo', url: '', status: 'pendente', reason: 'Dado fictício; falta confirmar aceitação no Brasil.', evidence: ['Trecho fictício.'], skills: ['SQL'], salary: 'Exemplo' }
    ],
    tool_calls: [{ name: 'busca_vagas (exemplo)', status: 'simulado', detail: 'Nenhuma chamada real foi feita.', duration_ms: 0, source: 'preview' }],
    verification: [{ job_id: 'exemplo-2', claim: 'Aceita candidatos do Brasil (exemplo)', status: 'incerta', evidence: 'Sem trecho real.', reason: 'Dado fictício de preview.' }]
  };

  var transcript = document.getElementById('transcript');
  var form = document.getElementById('chat-form');
  var input = document.getElementById('message-input');
  var sendButton = document.getElementById('send-button');
  var chips = document.getElementById('suggestions');
  var newSessionButton = document.getElementById('new-session');
  var modeBadge = document.getElementById('mode-indicator');
  var statusLine = document.getElementById('status-line');
  var evidenceBody = document.getElementById('evidence-body');

  var busy = false;
  var memorySessionId = '';
  var previewHost = (window.location.protocol !== 'http:' && window.location.protocol !== 'https:') ||
                    /claude/i.test(window.location.hostname);

  /* ---------- helpers (sem innerHTML: tudo via textContent) ---------- */

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function own(map, key) {
    return (key !== undefined && key !== null && Object.prototype.hasOwnProperty.call(map, key)) ? key : null;
  }

  function asArray(v) {
    return Array.isArray(v) ? v : [];
  }

  function toText(v) {
    if (v === null || v === undefined) return '';
    if (Array.isArray(v)) return v.map(toText).filter(Boolean).join(' · ');
    if (typeof v === 'object') {
      try { return JSON.stringify(v); } catch (e) { return ''; }
    }
    return String(v);
  }

  function safeUrl(u) {
    if (typeof u !== 'string' || !u.trim()) return null;
    try {
      var parsed = new URL(u.trim(), window.location.href);
      return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : null;
    } catch (e) {
      return null;
    }
  }

  function makeUuid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    var b = new Uint8Array(16);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(b);
    } else {
      for (var i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    }
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var h = [];
    for (var j = 0; j < 16; j++) h.push((b[j] + 0x100).toString(16).slice(1));
    return h.slice(0, 4).join('') + '-' + h.slice(4, 6).join('') + '-' + h.slice(6, 8).join('') + '-' +
           h.slice(8, 10).join('') + '-' + h.slice(10, 16).join('');
  }

  function getSessionId() {
    try {
      var id = window.sessionStorage.getItem(SESSION_KEY);
      if (!id) {
        id = makeUuid();
        window.sessionStorage.setItem(SESSION_KEY, id);
      }
      return id;
    } catch (e) {
      if (!memorySessionId) memorySessionId = makeUuid();
      return memorySessionId;
    }
  }

  function resetSessionId() {
    var id = makeUuid();
    memorySessionId = id;
    try { window.sessionStorage.setItem(SESSION_KEY, id); } catch (e) { /* armazenamento indisponível */ }
    return id;
  }

  /* ---------- estado da interface ---------- */

  function setMode(mode, isSample) {
    var text;
    var cls;
    if (mode === 'real') { text = 'Modo real'; cls = 'mode-real'; }
    else if (mode === 'dummy' || mode === 'demo') { text = 'Modo demo'; cls = 'mode-demo'; }
    else { text = 'Modo não informado'; cls = ''; }
    if (isSample) text += ' · exemplo de preview';
    modeBadge.textContent = text;
    modeBadge.className = 'mode' + (cls ? ' ' + cls : '');
  }

  function setBusy(value) {
    busy = value;
    sendButton.disabled = value;
    var buttons = chips.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = value;
    statusLine.textContent = value ? 'Buscando vagas e verificando afirmações…' : '';
    statusLine.className = value ? 'status-line is-busy' : 'status-line';
    transcript.setAttribute('aria-busy', value ? 'true' : 'false');
  }

  function scrollToEnd() {
    var last = transcript.lastElementChild;
    if (last && typeof last.scrollIntoView === 'function') {
      last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function renderEmpty() {
    transcript.textContent = '';
    transcript.appendChild(make('p', 'empty',
      'Escolha uma sugestão ou escreva sua pergunta. O Radar busca vagas e mostra, ao lado, as ferramentas usadas e a verificação de cada afirmação.'));
    evidenceBody.textContent = '';
    evidenceBody.appendChild(make('p', 'muted',
      'Quando houver resposta, aqui aparecem as ferramentas usadas, o tempo de cada uma e a verificação por afirmação.'));
  }

  function appendUser(text) {
    var wrap = make('article', 'msg msg-user');
    wrap.appendChild(make('p', 'msg-label', 'Você'));
    var body = make('div', 'msg-body');
    body.appendChild(make('p', '', text));
    wrap.appendChild(body);
    transcript.appendChild(wrap);
    scrollToEnd();
  }

  /* ---------- cards e evidências ---------- */

  function buildCard(job) {
    var card = make('article', 'job');
    var statusKey = own(STATUS_LABEL, job.status);
    card.appendChild(make('span', 'tag ' + (statusKey ? STATUS_CLASS[statusKey] : 'tag-outro'),
      statusKey ? STATUS_LABEL[statusKey] : (toText(job.status) || 'Sem status')));
    card.appendChild(make('h3', 'job-title', toText(job.title) || 'Vaga sem título'));

    var meta = [toText(job.company), toText(job.source)].filter(Boolean).join(' · ');
    if (meta) card.appendChild(make('p', 'job-meta', meta));
    if (job.salary) card.appendChild(make('p', 'job-fact', 'Salário: ' + toText(job.salary)));
    if (job.reason) card.appendChild(make('p', 'job-reason', toText(job.reason)));

    var skills = asArray(job.skills);
    if (skills.length) {
      var ul = make('ul', 'skills');
      skills.forEach(function (s) { ul.appendChild(make('li', '', toText(s))); });
      card.appendChild(ul);
    }

    var href = safeUrl(job.url);
    if (href) {
      var a = make('a', 'job-link', 'Abrir vaga');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      card.appendChild(a);
    }
    return card;
  }

  function renderEvidence(data, question, recs) {
    evidenceBody.textContent = '';
    if (question) evidenceBody.appendChild(make('p', 'evidence-query', 'Pergunta: ' + question));

    // Ferramentas
    evidenceBody.appendChild(make('h3', 'evidence-h', 'Ferramentas usadas'));
    var tools = asArray(data.tool_calls);
    if (!tools.length) {
      evidenceBody.appendChild(make('p', 'muted', 'Nenhuma ferramenta registrada.'));
    } else {
      var list = make('ul', 'rows');
      tools.forEach(function (t) {
        t = t || {};
        var li = make('li', 'row');
        var head = make('div', 'row-head');
        head.appendChild(make('strong', '', toText(t.name) || 'ferramenta'));
        var meta = [toText(t.status), typeof t.duration_ms === 'number' ? t.duration_ms + ' ms' : ''].filter(Boolean).join(' · ');
        head.appendChild(make('span', 'mono', meta));
        li.appendChild(head);
        if (t.detail) li.appendChild(make('p', 'muted', toText(t.detail)));
        if (t.source) li.appendChild(make('p', 'muted', 'Fonte: ' + toText(t.source)));
        list.appendChild(li);
      });
      evidenceBody.appendChild(list);
    }

    // Títulos por id de vaga, para ligar cada verificação à sua vaga
    var titleFor = Object.create(null);
    recs.forEach(function (r) {
      if (r && r.id !== undefined && r.id !== null) titleFor[String(r.id)] = toText(r.title);
    });

    // Verificação por afirmação
    evidenceBody.appendChild(make('h3', 'evidence-h', 'Verificação por afirmação'));
    var checks = asArray(data.verification);
    if (!checks.length) {
      evidenceBody.appendChild(make('p', 'muted', 'Nenhuma afirmação verificada nesta resposta.'));
    } else {
      checks.forEach(function (c) {
        c = c || {};
        var block = make('div', 'check');
        var key = own(VERIFY_LABEL, c.status);
        block.appendChild(make('span', 'tag ' + (key ? VERIFY_CLASS[key] : 'v-outro'),
          key ? VERIFY_LABEL[key] : (toText(c.status) || 'Sem status')));
        var jobName = c.job_id !== undefined && c.job_id !== null ? (titleFor[String(c.job_id)] || toText(c.job_id)) : '';
        block.appendChild(make('p', 'mono', 'Vaga: ' + (jobName || '—')));
        block.appendChild(make('p', 'check-claim', toText(c.claim)));
        if (c.evidence) block.appendChild(make('p', 'muted', 'Evidência: ' + toText(c.evidence)));
        if (c.reason) block.appendChild(make('p', 'muted', 'Motivo: ' + toText(c.reason)));
        evidenceBody.appendChild(block);
      });
    }

    // Trechos por vaga
    evidenceBody.appendChild(make('h3', 'evidence-h', 'Trechos das vagas'));
    if (!recs.length) {
      evidenceBody.appendChild(make('p', 'muted', 'Nenhuma vaga nesta resposta.'));
    } else {
      recs.forEach(function (r) {
        r = r || {};
        var block = make('div', 'check');
        block.appendChild(make('p', 'check-claim', toText(r.title) || 'Vaga sem título'));
        var ev = Array.isArray(r.evidence) ? r.evidence : (r.evidence ? [r.evidence] : []);
        if (!ev.length) {
          block.appendChild(make('p', 'muted', 'Sem trechos registrados.'));
        } else {
          var ul = make('ul', 'quotes');
          ev.forEach(function (item) { ul.appendChild(make('li', '', toText(item))); });
          block.appendChild(ul);
        }
        evidenceBody.appendChild(block);
      });
    }
  }

  /* ---------- resposta e falha ---------- */

  function renderResponse(data, question, isSample) {
    if (!data || typeof data !== 'object') throw new Error('Resposta em formato inesperado');

    var answer = typeof data.answer === 'string' ? data.answer : '';
    var recs = asArray(data.recommendations);

    var wrap = make('article', 'msg msg-assistant');
    wrap.appendChild(make('p', 'msg-label', 'Radar'));
    var body = make('div', 'msg-body');

    if (!answer.trim()) {
      body.appendChild(make('p', 'muted', 'A resposta veio vazia.'));
    } else {
      answer.split(/\n{2,}/).forEach(function (par) {
        if (par.trim()) body.appendChild(make('p', '', par.trim()));
      });
    }

    if (recs.length) {
      var list = make('div', 'jobs');
      recs.forEach(function (r) { list.appendChild(buildCard(r || {})); });
      body.appendChild(list);
    }

    wrap.appendChild(body);
    transcript.appendChild(wrap);
    setMode(data.mode, isSample);
    renderEvidence(data, question, recs);
    scrollToEnd();
  }

  function showFailure(question, error) {
    var wrap = make('article', 'msg msg-assistant msg-error');
    wrap.appendChild(make('p', 'msg-label', 'Radar'));
    var body = make('div', 'msg-body');
    body.appendChild(make('p', '', 'Não foi possível obter a resposta do servidor. Verifique se o Radar Remoto está em execução e tente de novo.'));
    body.appendChild(make('p', 'muted', 'Detalhe: ' + (error && error.message ? error.message : 'erro desconhecido')));

    var actions = make('div', 'actions');

    var retry = make('button', 'btn btn-ghost', 'Reenviar');
    retry.type = 'button';
    retry.disabled = busy;
    retry.addEventListener('click', function () {
      wrap.remove();
      sendMessage(question, true);
    });
    actions.appendChild(retry);

    if (previewHost) {
      var sample = make('button', 'btn btn-ghost', 'Ver exemplo visual (preview)');
      sample.type = 'button';
      sample.addEventListener('click', function () {
        wrap.remove();
        renderResponse(SAMPLE, question, true);
      });
      actions.appendChild(sample);
    }

    body.appendChild(actions);
    wrap.appendChild(body);
    transcript.appendChild(wrap);
    scrollToEnd();
  }

  /* ---------- envio ---------- */

  function sendMessage(raw, isRetry) {
    var text = String(raw === null || raw === undefined ? '' : raw).trim();
    if (!text || busy) return;

    if (!isRetry) {
      appendUser(text);
      input.value = '';
    }
    setBusy(true);

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ session_id: getSessionId(), message: text })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        renderResponse(data, text, false);
      })
      .catch(function (err) {
        showFailure(text, err);
      })
      .then(function () {
        setBusy(false);
      });
  }

  function buildChips() {
    SUGGESTIONS.forEach(function (text) {
      var b = make('button', 'chip', text);
      b.type = 'button';
      b.addEventListener('click', function () { sendMessage(text, false); });
      chips.appendChild(b);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    sendMessage(input.value, false);
  });

  newSessionButton.addEventListener('click', function () {
    if (busy) return;
    resetSessionId();
    setMode(null);
    renderEmpty();
    input.focus();
  });

  buildChips();
  renderEmpty();
  setMode(null);
  setBusy(false);
})();
</script>
</body>
</html>
